[package]
name = "tauri-bun-stock-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_bun_stock_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
# Vendored so we can patch the sidecar spawn to use CREATE_NO_WINDOW
# (prevents a black console window appearing next to the packaged GUI app).
# See vendor/tauri-plugin-tauribun/README.md. To rebase on an upstream
# release, diff against the crates.io source and re-apply the one change in
# src/desktop.rs.
tauri-plugin-tauribun = { path = "vendor/tauri-plugin-tauribun" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
